services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  user-service:
    build:
      context: .
      dockerfile: cmd/user-service/Dockerfile
    env_file:
      - .env.example
    environment:
      PORT: 8080
      DATABASE_URL: host=postgres port=5432 user=postgres dbname=cloud sslmode=disable
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  auction-service:
    build:
      context: .
      dockerfile: cmd/auction-service/Dockerfile
    env_file:
      - .env.example
    environment:
      PORT: 8081
      DATABASE_URL: host=postgres port=5432 user=postgres dbname=cloud sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "8081:8081"

  bid-service:
    build:
      context: .
      dockerfile: cmd/bid-service/Dockerfile
    env_file:
      - .env.example
    environment:
      PORT: 8082
      DATABASE_URL: host=postgres port=5432 user=postgres dbname=cloud sslmode=disable
      REDIS_ADDR: redis:6379
      AUCTION_SERVICE_URL: http://auction-service:8081
    depends_on:
      - postgres
      - redis
      - auction-service
    ports:
      - "8082:8082"

volumes:
  pgdata:
