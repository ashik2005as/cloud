apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-service
  namespace: cloud-auction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auction-service
  template:
    metadata:
      labels:
        app: auction-service
    spec:
      containers:
        - name: auction-service
          image: ghcr.io/ashik2005as/cloud-auction-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: cloud-config
                  key: REDIS_ADDR
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloud-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-secrets
                  key: INTERNAL_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: auction-service
  namespace: cloud-auction
spec:
  selector:
    app: auction-service
  ports:
    - port: 8081
      targetPort: 8081
