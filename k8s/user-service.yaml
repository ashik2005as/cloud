apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: cloud-auction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/ashik2005as/cloud-user-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloud-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: cloud-auction
spec:
  selector:
    app: user-service
  ports:
    - port: 8080
      targetPort: 8080
